name: Daily Stock Analysis

on:
  push:
    branches: [research/evening-prices]
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 3 * * *'
    - cron: '0 6 * * *'
    - cron: '0 9 * * *'  #11
    - cron: '0 12 * * *'  #13
    - cron: '0 15 * * *'  #15
    - cron: '0 18 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      validate_only:
        description: Run analysis and archive results without updating Google Drive
        type: boolean
        default: false
      walk_forward:
        description: Compare forecast methods on historical quarterly splits
        type: boolean
        default: false
  
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 📦 Кэширование данных (usd_data.json и model_params)
      uses: actions/cache@v4
      with:
        path: evening_summary.json
        if-no-files-found: error

    - name: Archive walk-forward results
      if: (inputs.walk_forward || github.event_name == 'push') == true
      uses: actions/upload-artifact@v4
      with:
        name: stockan-walk-forward
        path: |
          walk_forward_predictions.csv
          portfolio_summary.json
          portfolio_equity.csv
          portfolio_trades.csv
          frequency_summary.json
        if-no-files-found: error

    - name: ☁️ Загрузка результатов на Google Drive
      if: success() && github.ref == 'refs/heads/main' && inputs.validate_only != true && (inputs.walk_forward || github.event_name == 'push') != true
      env:
        GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
        GOOGLE_DRIVE_FILE_ID: ${{ secrets.GOOGLE_DRIVE_FILE_ID }}
      run: |
        echo "📤 Загружаю результаты на Google Drive..."
        python upload_to_drive.py
    
    - name: 🚨 Уведомление об ошибке
      if: failure()
      run: |
        echo "🚨 АНАЛИЗ ПРОВАЛЕН!"
        echo ""
        echo "📋 Возможные причины:"
        echo "   1. Недоступна история курса USD"
        echo "   2. Ошибка в коде анализа"
        echo "   3. MOEX API недоступен"
        echo "   4. Проблемы с зависимостями"
        echo ""
        echo "💡 Решение:"
        echo "   1. Проверьте логи выше"
        echo "   2. Исправьте ошибку"
        echo "   3. Перезапустите workflow"
