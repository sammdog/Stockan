name: Daily Stock Analysis

on:
  schedule:
    # Запускать каждый день в 7:00 по UTC (10:00 по Москве)
    - cron: '0 7 * * *'
  # Также можно запускать вручную из интерфейса GitHub
  workflow_dispatch:
    inputs:
      manual_run:
        description: 'Запустить анализ вручную'
        required: false
        default: 'false'

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # Даем 20 минут на выполнение
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: 🔍 Run analysis
      env:
        GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
        GOOGLE_DRIVE_FILE_ID: ${{ secrets.GOOGLE_DRIVE_FILE_ID }}
      run: |
        python daily_analysis.py
    
    - name: ☁️ Upload to Google Drive
      env:
        GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
        GOOGLE_DRIVE_FILE_ID: ${{ secrets.GOOGLE_DRIVE_FILE_ID }}
      run: |
        python upload_to_drive.py
    
    - name: 📊 Report status
      if: always()
      run: |
        echo "✅ Анализ завершен в $(date)"
        echo "📅 Следующий запуск: завтра в 10:00 по Москве"

    - name: 📱 Send Telegram notification
      if: success()
      run: |
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
        -d "chat_id=${{ secrets.YOUR_CHAT_ID }}" \
        -d "text=✅ Ежедневный анализ завершен! Проверьте /results"
