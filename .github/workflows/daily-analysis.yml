name: Daily Stock Analysis

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 3 * * *'
    - cron: '0 6 * * *'
    - cron: '0 9 * * *'  #11
    - cron: '0 12 * * *'  #13
    - cron: '0 15 * * *'  #15
    - cron: '0 18 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 📦 Кэширование данных (usd_data.json и model_params)
      uses: actions/cache@v4
      with:
        path: |
          usd_data.json
          model_params
        key: ${{ runner.os }}-state-cache-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-state-cache-
          
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas numpy lightgbm scikit-learn joblib google-auth google-api-python-client
    
    - name: 🔍 Проверка необходимых файлов
      run: |
        echo "📁 Проверяю наличие файлов в репозитории..."
        ls -la
        
        echo ""
        echo "🔍 Проверяю наличие usd_data.json..."
        if [ -f "usd_data.json" ]; then
          echo "✅ Файл usd_data.json найден"
          echo "📏 Размер: $(wc -c < usd_data.json) байт"
          echo "📄 Первые 100 символов:"
          head -c 100 usd_data.json
          echo ""
        else
          echo "❌ Файл usd_data.json НЕ НАЙДЕН"
          echo "📋 Что сделать:"
          echo "  1. Запустите анализ в Colab"
          echo "  2. Скачайте usd_github_backup.json"
          echo "  3. Загрузите в репозиторий как usd_data.json"
          exit 1
        fi
        
        echo ""
        echo "🔍 Проверяю наличие daily_analysis_real.py..."
        if [ -f "daily_analysis_real.py" ]; then
          echo "✅ Файл daily_analysis_real.py найден"
        else
          echo "❌ Файл daily_analysis_real.py НЕ НАЙДЕН"
          exit 1
        fi
    
    - name: 🚀 Запуск ПОЛНОГО анализа (daily_analysis_real.py)
      env:
        GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
        GOOGLE_DRIVE_FILE_ID: ${{ secrets.GOOGLE_DRIVE_FILE_ID }}
      run: |
        echo "🚀 Запускаю ПОЛНЫЙ анализ из daily_analysis_real.py..."
        python daily_analysis_real.py
    
    - name: ☁️ Загрузка результатов на Google Drive
      if: success()
      env:
        GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
        GOOGLE_DRIVE_FILE_ID: ${{ secrets.GOOGLE_DRIVE_FILE_ID }}
      run: |
        echo "📤 Загружаю результаты на Google Drive..."
        python upload_to_drive.py
    
    - name: 🚨 Уведомление об ошибке
      if: failure()
      run: |
        echo "🚨 АНАЛИЗ ПРОВАЛЕН!"
        echo ""
        echo "📋 Возможные причины:"
        echo "   1. Отсутствует файл usd_data.json"
        echo "   2. Ошибка в коде анализа"
        echo "   3. MOEX API недоступен"
        echo "   4. Проблемы с зависимостями"
        echo ""
        echo "💡 Решение:"
        echo "   1. Проверьте логи выше"
        echo "   2. Исправьте ошибку"
        echo "   3. Перезапустите workflow"
