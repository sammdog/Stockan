name: Daily Stock Analysis

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 3 * * *'
    - cron: '0 6 * * *'
    - cron: '0 9 * * *'  #11
    - cron: '0 12 * * *'  #13
    - cron: '0 15 * * *'  #15
    - cron: '0 18 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      validate_only:
        description: Run analysis and archive results without updating Google Drive
        type: boolean
        default: false
  
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 📦 Кэширование данных (курса USD)
      uses: actions/cache@v4
      with:
        path: |
          usd_data.json
        key: ${{ runner.os }}-state-cache-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-state-cache-
          
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas numpy lightgbm scikit-learn joblib google-auth google-api-python-client
    
    - name: 🔍 Проверка необходимых файлов
      run: |
        echo "📁 Проверяю наличие файлов в репозитории..."
        ls -la
        
        echo ""
        echo "🔍 Проверяю наличие daily_analysis_real.py..."
        if [ -f "daily_analysis_real.py" ]; then
          echo "✅ Файл daily_analysis_real.py найден"
        else
          echo "❌ Файл daily_analysis_real.py НЕ НАЙДЕН"
          exit 1
        fi
    
    - name: 🚀 Запуск ПОЛНОГО анализа (daily_analysis_real.py)
      env:
        GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
        GOOGLE_DRIVE_FILE_ID: ${{ secrets.GOOGLE_DRIVE_FILE_ID }}
      run: |
        echo "🚀 Запускаю ПОЛНЫЙ анализ из daily_analysis_real.py..."
        python daily_analysis_real.py
    
    - name: Archive forecast for backtesting
      uses: actions/upload-artifact@v4
      with:
        name: stockan-forecast
        path: latest_results.json
        if-no-files-found: error

    - name: ☁️ Загрузка результатов на Google Drive
      if: success() && github.ref == 'refs/heads/main' && inputs.validate_only != true
      env:
        GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
        GOOGLE_DRIVE_FILE_ID: ${{ secrets.GOOGLE_DRIVE_FILE_ID }}
      run: |
        echo "📤 Загружаю результаты на Google Drive..."
        python upload_to_drive.py
    
    - name: 🚨 Уведомление об ошибке
      if: failure()
      run: |
        echo "🚨 АНАЛИЗ ПРОВАЛЕН!"
        echo ""
        echo "📋 Возможные причины:"
        echo "   1. Недоступна история курса USD"
        echo "   2. Ошибка в коде анализа"
        echo "   3. MOEX API недоступен"
        echo "   4. Проблемы с зависимостями"
        echo ""
        echo "💡 Решение:"
        echo "   1. Проверьте логи выше"
        echo "   2. Исправьте ошибку"
        echo "   3. Перезапустите workflow"
