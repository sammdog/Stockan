name: Daily Stock Analysis
on:
  push:
    branches: [audit/intraday-quotes]
jobs:
  quote-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: python -m pip install requests==2.31.0 pyTelegramBotAPI==4.15.2
      - run: |
          python - <<'PY'
          from datetime import datetime
          from replit_bot.main import MSK, intraday_quote
          now = datetime.now(MSK)
          for ticker in ('SBER', 'CBOM'):
              quote = intraday_quote(ticker, now)
              assert quote is not None, ticker
              assert quote[0] <= now
              print(f'{ticker}: MOEX candle {quote[0]} at {quote[1]}, 30m reference {quote[2]}')
          PY
